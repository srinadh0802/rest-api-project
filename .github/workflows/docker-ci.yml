name: Docker CI

on:
  push:
    branches:
      - feature/dockerize-store-api

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t store-api:test .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: store-api:test
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: store-api:test
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
